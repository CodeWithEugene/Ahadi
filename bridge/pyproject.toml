[project]
name = "ahadi-bridge"
version = "0.1.0"
description = "Ahadi bridge: Omega channel server, skill tools, ledger store and Stellar testnet operations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.120.*",
  "uvicorn[standard]>=0.34",
  "websockets>=15",
  "httpx>=0.28",
  "stellar-sdk==16.1.1",
  "pydantic>=2.10",
  "python-dotenv>=1.0",
  "sse-starlette>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ahadi_bridge"]

[tool.pytest.ini_options]
markers = ["chain: talks to Stellar testnet (slow)", "metta: runs the MeTTa rules in the Omega image (Docker)"]
addopts = "-m 'not chain and not metta'"
asyncio_mode = "auto"
pythonpath = ["."]
